version: '3.8'

services:
  # ============================================================================
  # Database Service: MongoDB 7.0
  # ============================================================================
  mongodb:
    image: mongo:7.0
    container_name: cpet-prod-mongodb
    restart: unless-stopped
    volumes:
      - cpet_prod_mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: cpet
    networks:
      - cpet_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # Cache & Queue Service: Redis 7.2 Alpine
  # ============================================================================
  redis:
    image: redis:7.2-alpine
    container_name: cpet-prod-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - cpet_prod_redis_data:/data
    networks:
      - cpet_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ============================================================================
  # Backend API Service: Node.js 20 Express
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cpet-prod-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/cpet
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-cpet_prod_super_secret_jwt_key_at_least_32_characters_long}
      JWT_EXPIRES_IN: 7d
      COOKIE_SECRET: ${COOKIE_SECRET:-cpet_prod_cookie_signing_secret_key_at_least_32_chars}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1}
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 2000
    networks:
      - cpet_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ============================================================================
  # Frontend Web & Reverse Proxy Service: Nginx 1.27
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: cpet-prod-frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cpet_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  cpet_network:
    driver: bridge

volumes:
  cpet_prod_mongo_data:
    driver: local
  cpet_prod_redis_data:
    driver: local
