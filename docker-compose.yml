services:
  mongodb:
    image: mongo:7.0
    container_name: cpet-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - cpet_mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: cpet
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: cpet-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - cpet_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cpet_mongo_data:
  cpet_redis_data:
